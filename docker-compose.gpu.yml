# Docker Compose: 6GB VRAM GPU Sequential Sharing
# ColPali extraction → stop → SGLang generation → stop
#
# Usage:
#   docker compose -f docker-compose.gpu.yml up colpali  # Run extraction
#   docker compose -f docker-compose.gpu.yml stop colpali
#   docker compose -f docker-compose.gpu.yml up sglang   # Run generation
#
# For full pipeline (automated):
#   docker compose -f docker-compose.gpu.yml run --rm pipeline

services:
  colpali:
    build:
      context: .
      dockerfile: docker/Dockerfile.colpali
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - COLPALI_MODEL=${COLPALI_MODEL:-vidore/colpali-v1.2}
      - COLPALI_BATCH_SIZE=${COLPALI_BATCH_SIZE:-4}
      - CHECKPOINT_ENABLED=true
      - CHECKPOINT_DIR=/app/checkpoints
    volumes:
      - ./model/cache:/root/.cache/huggingface
      - ./checkpoints:/app/checkpoints
      - ./data:/app/data
    ports:
      - "8001:8001"
    profiles:
      - gpu

  sglang:
    build:
      context: .
      dockerfile: docker/Dockerfile.sglang
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - SGLANG_MODEL=${SGLANG_MODEL:-Qwen/Qwen2.5-3B-Instruct}
      - SGLANG_MAX_TOKENS=${SGLANG_MAX_TOKENS:-4096}
      - SGLANG_PORT=8002
    volumes:
      - ./model/cache:/root/.cache/huggingface
      - ./checkpoints:/app/checkpoints
    ports:
      - "8002:8002"
    profiles:
      - gpu

  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on: []
    environment:
      - COLPALI_ENDPOINT=http://colpali:8001
      - SGLANG_ENDPOINT=http://sglang:8002
      - CHECKPOINT_ENABLED=true
      - CHECKPOINT_DIR=/app/checkpoints
      - DATABASE_URL=${DATABASE_URL:-}
    env_file: .env
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./data:/app/data
      - ./outputs:/app/outputs
    command: >
      python -c "
      from template_engine.pipeline import run_pipeline
      import sys
      result = run_pipeline(sys.argv[1] if len(sys.argv) > 1 else '/app/data/input.pdf')
      print(f'Pipeline complete: {result}')
      "
    profiles:
      - gpu

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=mospi_secure_password
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./statathon.db}
      - TRACING_ENABLED=${TRACING_ENABLED:-0}
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - ./model/cache:/app/model/cache
      - ./outputs:/app/outputs
      - ./checkpoints:/app/checkpoints

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/mospi_secure_password
    ports:
      - "7474:7474"
      - "7687:7687"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
