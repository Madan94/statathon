# Docker Compose: GPU — ColPali + SGLang on shared GPU (g5.xlarge ~24GB VRAM)
#
# Local / EC2 usage:
#   docker compose -f docker-compose.gpu.yml --profile gpu build colpali sglang
#   docker compose -f docker-compose.gpu.yml --profile gpu up -d colpali sglang
#
# Sequential pipeline (README):
#   docker compose -f docker-compose.gpu.yml --profile gpu run --rm pipeline

services:
  colpali:
    build:
      context: .
      dockerfile: docker/Dockerfile.colpali
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HOME=/cache
      - MODEL_ID=${COLPALI_MODEL:-vidore/colpali-v1.2}
      - DEVICE=auto
      - COLPALI_DPI=${COLPALI_DPI:-96}
      - COLPALI_PAGE_BATCH_SIZE=${COLPALI_PAGE_BATCH_SIZE:-1}
    volumes:
      - ${GPU_MODEL_CACHE:-./model/cache}:/cache
      - ./data:/app/data
    ports:
      - "8100:8100"
    profiles:
      - gpu
    restart: unless-stopped

  sglang:
    build:
      context: .
      dockerfile: docker/Dockerfile.sglang
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HOME=/cache
      - SGLANG_MODEL=${SGLANG_MODEL:-Qwen/Qwen2.5-3B-Instruct}
      - SGLANG_PORT=30000
      - SGLANG_MEM_FRACTION_STATIC=${SGLANG_MEM_FRACTION_STATIC:-0.42}
    volumes:
      - ${GPU_MODEL_CACHE:-./model/cache}:/cache
    ports:
      - "30000:30000"
    profiles:
      - gpu
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on: []
    environment:
      - COLPALI_ENDPOINT=http://colpali:8100/extract
      - SGLANG_ENDPOINT=http://sglang:30000
      - SGLANG_BACKEND=sglang
      - CHECKPOINT_ENABLED=true
      - CHECKPOINT_DIR=/app/checkpoints
      - DATABASE_URL=${DATABASE_URL:-}
    env_file: .env
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./data:/app/data
      - ./outputs:/app/outputs
    command: >
      python -c "
      from template_engine.pipeline import run_pipeline
      import sys
      result = run_pipeline(sys.argv[1] if len(sys.argv) > 1 else '/app/data/input.pdf')
      print(f'Pipeline complete: {result}')
      "
    profiles:
      - gpu

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=mospi_secure_password
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./statathon.db}
      - TRACING_ENABLED=${TRACING_ENABLED:-0}
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - ./model/cache:/app/model/cache
      - ./outputs:/app/outputs
      - ./checkpoints:/app/checkpoints

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/mospi_secure_password
    ports:
      - "7474:7474"
      - "7687:7687"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
