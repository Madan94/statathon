# Docker Compose: 6GB VRAM GPU Sequential Sharing
#
# ═══════════════════════════════════════════════════════════
# HOW THIS WORKS — READ FIRST
# ═══════════════════════════════════════════════════════════
#
# There are TWO ways to use GPU services:
#
# ── WAY 1: STANDALONE EXTRACTION (debug / inspect the AST JSON)
#
#   Step 1: Place your legacy PDF in ./data/  e.g. ./data/plfs_q3_2024.pdf
#   Step 2: Build the images (one-time, ~15-40 min):
#     docker compose -f docker-compose.gpu.yml --profile gpu build colpali sglang
#   Step 3: Run ColPali extraction (PDF → page regions JSON):
#     docker compose -f docker-compose.gpu.yml --profile gpu up -d colpali
#     docker compose -f docker-compose.gpu.yml --profile gpu logs -f colpali
#     (wait until: "Application startup complete")
#   Step 4: Test ColPali health:
#     curl http://localhost:8001/health
#   Step 5: Extract a PDF (outputs AST JSON to ./outputs/):
#     PDF_INPUT_PATH=/app/data/plfs_q3_2024.pdf \
#       docker compose -f docker-compose.gpu.yml --profile gpu run --rm pipeline
#     → JSON saved to ./outputs/template_<hash>.json
#   Step 6: Stop ColPali to free VRAM:
#     docker compose -f docker-compose.gpu.yml --profile gpu stop colpali
#   Step 7: Start SGLang if needed (for AST grammar-constrained pass):
#     docker compose -f docker-compose.gpu.yml --profile gpu up -d sglang
#
# ── WAY 2: FULL STACK (recommended — template saved to DB, reusable)
#
#   Step 1: Start all non-GPU services:
#     docker compose -f docker-compose.gpu.yml up -d api dashboard neo4j redis
#   Step 2: Start GPU extraction service (in a separate terminal):
#     docker compose -f docker-compose.gpu.yml --profile gpu up -d colpali
#   Step 3: In the Dashboard (http://localhost:3000):
#     Report Builder → Upload Legacy PDF → name it → Submit
#     → The API calls ColPali at http://colpali:8001/extract
#     → Template saved to storage/templates/ AND database (report_templates table)
#     → You get back a template_id
#   Step 4: Stop ColPali, start SGLang if your report uses local LLM:
#     docker compose -f docker-compose.gpu.yml --profile gpu stop colpali
#     docker compose -f docker-compose.gpu.yml --profile gpu up -d sglang
#   Step 5: Upload your dataset CSV in the Dashboard → run Analysis
#   Step 6: Report Builder → Select template + analysis → Generate
#     → PDF saved to ./outputs/
#
# ═══════════════════════════════════════════════════════════

services:
  colpali:
    build:
      context: .
      dockerfile: docker/Dockerfile.colpali
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      # MODEL_ID is what services/colpali/main.py actually reads via os.getenv("MODEL_ID")
      - MODEL_ID=${COLPALI_MODEL:-vidore/colpali-v1.2}
      # COLPALI_PAGE_BATCH_SIZE is what main.py reads — not COLPALI_BATCH_SIZE
      - COLPALI_PAGE_BATCH_SIZE=${COLPALI_BATCH_SIZE:-4}
      - COLPALI_PORT=8001
      - DEVICE=auto
      - CHECKPOINT_ENABLED=true
      - CHECKPOINT_DIR=/app/checkpoints
    volumes:
      # HF_HOME in Dockerfile is /cache — mount must match exactly or models re-download every restart
      - ./model/cache:/cache
      - ./checkpoints:/app/checkpoints
      - ./data:/app/data
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    profiles:
      - gpu

  sglang:
    build:
      context: .
      dockerfile: docker/Dockerfile.sglang
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - SGLANG_MODEL=${SGLANG_MODEL:-Qwen/Qwen2.5-3B-Instruct}
      - SGLANG_MAX_TOKENS=${SGLANG_MAX_TOKENS:-4096}
      # SGLANG_PORT default is already 8002 in Dockerfile — keep explicit here for clarity
      - SGLANG_PORT=8002
      - SGLANG_MEM_FRACTION_STATIC=${SGLANG_MEM_FRACTION:-0.42}
    volumes:
      # HF_HOME in Dockerfile is /cache — must match
      - ./model/cache:/cache
      - ./checkpoints:/app/checkpoints
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    profiles:
      - gpu

  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on: []
    environment:
      - COLPALI_ENDPOINT=http://colpali:8001
      - SGLANG_ENDPOINT=http://sglang:8002
      - CHECKPOINT_ENABLED=true
      - CHECKPOINT_DIR=/app/checkpoints
      - DATABASE_URL=${DATABASE_URL:-}
      # Set PDF_INPUT_PATH when running:
      #   PDF_INPUT_PATH=/app/data/plfs_q3_2024.pdf docker compose ... run --rm pipeline
      - PDF_INPUT_PATH=${PDF_INPUT_PATH:-/app/data/input.pdf}
      - TEMPLATE_NAME=${TEMPLATE_NAME:-extracted_template}
    env_file: .env
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./data:/app/data
      - ./outputs:/app/outputs
    # Runs run_extraction_pipeline() and saves AST JSON to /app/outputs/
    # The output file path is printed at the end: "Saved AST to /app/outputs/..."
    command: >
      python -c "
      import os, json
      from pathlib import Path
      from template_engine.pipeline import run_extraction_pipeline
      pdf = os.getenv('PDF_INPUT_PATH', '/app/data/input.pdf')
      name = os.getenv('TEMPLATE_NAME', 'extracted_template')
      print(f'Starting extraction: {pdf}  name={name}')
      result = run_extraction_pipeline(pdf, template_name=name)
      if result.success and result.ast:
          out = Path('/app/outputs') / f'template_{result.source_hash[:8]}.json'
          out.write_text(json.dumps(result.ast.to_dict(), indent=2, ensure_ascii=False))
          print(f'SUCCESS — AST saved to {out}')
          print(f'  pages: {result.progress.pages_processed}')
          print(f'  entities: {result.progress.entities_found}')
          print(f'  questions: {result.progress.questions_inferred}')
          print(f'  partial: {result.partial}')
          if result.failed_pages:
              print(f'  failed_pages: {result.failed_pages}')
      else:
          print('FAILED')
          for e in result.progress.errors:
              print(f'  ERROR: {e}')
          raise SystemExit(1)
      "
    profiles:
      - gpu

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      # These override values from env_file where the service names differ from localhost
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-mospi_secure_password}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./statathon.db}
      - TRACING_ENABLED=${TRACING_ENABLED:-0}
      # env_file sets REDIS_URL=redis://localhost:6379/0 (localhost = container itself, broken)
      # This env: block overrides it with the correct docker service name
      - REDIS_URL=redis://redis:6379/0
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - ./model/cache:/app/model/cache
      - ./outputs:/app/outputs
      - ./checkpoints:/app/checkpoints

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-mospi_secure_password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  neo4j_data:
  redis_data:

