# Docker Compose: 6GB VRAM GPU Sequential Sharing
# ColPali extraction → stop → SGLang generation → stop
#
# ── Build images (one-time, cached after success):
#   docker compose -f docker-compose.gpu.yml --profile gpu build colpali sglang
#
# ── Sequential pipeline (recommended):
#   docker compose -f docker-compose.gpu.yml --profile gpu up colpali
#   docker compose -f docker-compose.gpu.yml --profile gpu stop colpali
#   docker compose -f docker-compose.gpu.yml --profile gpu up sglang
#   docker compose -f docker-compose.gpu.yml --profile gpu stop sglang
#
# ── One-shot pipeline with custom PDF:
#   PDF_INPUT_PATH=/app/data/myfile.pdf \
#     docker compose -f docker-compose.gpu.yml --profile gpu run --rm pipeline
#
# ── API + Dashboard only (no GPU needed):
#   docker compose -f docker-compose.gpu.yml up api dashboard neo4j redis

services:
  colpali:
    build:
      context: .
      dockerfile: docker/Dockerfile.colpali
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      # MODEL_ID is what services/colpali/main.py actually reads via os.getenv("MODEL_ID")
      - MODEL_ID=${COLPALI_MODEL:-vidore/colpali-v1.2}
      # COLPALI_PAGE_BATCH_SIZE is what main.py reads — not COLPALI_BATCH_SIZE
      - COLPALI_PAGE_BATCH_SIZE=${COLPALI_BATCH_SIZE:-4}
      - COLPALI_PORT=8001
      - DEVICE=auto
      - CHECKPOINT_ENABLED=true
      - CHECKPOINT_DIR=/app/checkpoints
    volumes:
      # HF_HOME in Dockerfile is /cache — mount must match exactly or models re-download every restart
      - ./model/cache:/cache
      - ./checkpoints:/app/checkpoints
      - ./data:/app/data
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    profiles:
      - gpu

  sglang:
    build:
      context: .
      dockerfile: docker/Dockerfile.sglang
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - SGLANG_MODEL=${SGLANG_MODEL:-Qwen/Qwen2.5-3B-Instruct}
      - SGLANG_MAX_TOKENS=${SGLANG_MAX_TOKENS:-4096}
      # SGLANG_PORT default is already 8002 in Dockerfile — keep explicit here for clarity
      - SGLANG_PORT=8002
      - SGLANG_MEM_FRACTION_STATIC=${SGLANG_MEM_FRACTION:-0.42}
    volumes:
      # HF_HOME in Dockerfile is /cache — must match
      - ./model/cache:/cache
      - ./checkpoints:/app/checkpoints
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    profiles:
      - gpu

  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on: []
    environment:
      - COLPALI_ENDPOINT=http://colpali:8001
      - SGLANG_ENDPOINT=http://sglang:8002
      - CHECKPOINT_ENABLED=true
      - CHECKPOINT_DIR=/app/checkpoints
      - DATABASE_URL=${DATABASE_URL:-}
      # Set PDF_INPUT_PATH when running: PDF_INPUT_PATH=/app/data/myfile.pdf docker compose run --rm pipeline
      - PDF_INPUT_PATH=${PDF_INPUT_PATH:-/app/data/input.pdf}
    env_file: .env
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./data:/app/data
      - ./outputs:/app/outputs
    # Uses PDF_INPUT_PATH env var — safe to pass via docker compose run -e or host env
    command: >
      python -c "
      import os
      from template_engine.pipeline import run_pipeline
      pdf = os.getenv('PDF_INPUT_PATH', '/app/data/input.pdf')
      result = run_pipeline(pdf)
      print(f'Pipeline complete: {result}')
      "
    profiles:
      - gpu

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      # These override values from env_file where the service names differ from localhost
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-mospi_secure_password}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./statathon.db}
      - TRACING_ENABLED=${TRACING_ENABLED:-0}
      # env_file sets REDIS_URL=redis://localhost:6379/0 (localhost = container itself, broken)
      # This env: block overrides it with the correct docker service name
      - REDIS_URL=redis://redis:6379/0
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - ./model/cache:/app/model/cache
      - ./outputs:/app/outputs
      - ./checkpoints:/app/checkpoints

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-mospi_secure_password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  neo4j_data:
  redis_data:
