services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=mospi_secure_password
      # Redis: .env uses localhost (local dev). Inside Docker must be the service name.
      - REDIS_URL=redis://redis:6379/0
      # This compose has no colpali/sglang services. Fall back to pdfplumber for extraction.
      - VLM_BACKEND=fallback
      - SGLANG_BACKEND=
      - CHECKPOINT_ENABLED=true
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - ./model/cache:/app/model/cache
      - ./model/weights:/app/model/weights
      - ./tests:/app/tests
      - ./test_data:/app/test_data
  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/mospi_secure_password
    ports:
      - "7474:7474"
      - "7687:7687"
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_API_URL is baked into client bundles at build time.
        # Browser uses /api/backend same-origin proxy (lib/api.ts) — localhost:8000
        # is the fallback that works whether running Docker or not.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      # API_INTERNAL_URL is read by SSR routes (app/api/backend/[...path]/route.ts)
      # for server-side proxying. Must use Docker service name, not localhost.
      - API_INTERNAL_URL=http://api:8000
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data: