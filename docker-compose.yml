services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=mospi_secure_password
      - REDIS_URL=redis://redis:6379/0
      - VLM_BACKEND=fallback
      - SGLANG_BACKEND=
      - CHECKPOINT_ENABLED=true
      - EXTRACTION_PIPELINE=v1
    env_file: .env
    volumes:
      - ./storage:/app/storage
      - ./model/cache:/app/model/cache
      - ./model/weights:/app/model/weights
      - ./tests:/app/tests
      - ./test_data:/app/test_data
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/mospi_secure_password
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      - API_INTERNAL_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: