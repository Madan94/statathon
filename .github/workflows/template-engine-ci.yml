name: CI — Template Engine Tests

on:
  push:
    branches: [main, feature/rev-template]
    paths:
      - 'template_engine/**'
      - 'agents/**'
      - 'report_builder/**'
      - 'ast_core/**'
      - 'tests/test_template_engine/**'
      - 'requirements*.txt'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run template engine tests
        env:
          CHECKPOINT_ENABLED: "false"
          TRACING_ENABLED: "0"
          LTM_ENABLED: "0"
        run: |
          python -m pytest tests/test_template_engine/ \
            -m "not live" \
            -q --tb=short \
            --cov=template_engine \
            --cov=agents \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install linters
        run: pip install ruff

      - name: Lint check
        run: |
          ruff check template_engine/ agents/ report_builder/ ast_core/ --select E,F,W --ignore E501
